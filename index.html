{

const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());

const addD=(d,n)=>{const x=new Date(d.getFullYear(),d.getMonth(),d.getDate());x.setDate(x.getDate()+n);return x};

libre:[['am','09:00','Al levantarte'],['train','11:00','Entreno'],['tarde','17:00','Tarde en familia'],['pm','23:00','Antes de dormir']]};

const WATER=12;
const MEAS=[['kg','Peso','kg','Ej.: 78,4','En ayunas, después del baño'],['cm','Cintura','cm','Ej.: 86','A la altura del ombligo, sin apretar'],['bi','Bíceps','cm','Ej.: 36','Brazo flexionado, en la parte más ancha'],['qu','Cuádriceps','cm','Ej.: 58','De pie y relajado, en la parte más ancha del muslo'],['ne','Cuello','cm','Ej.: 39','Justo por debajo de la nuez']];

/* Rutina del Excel: [nombre, series por semana 1-4, reps, intensidad, descanso s, tempo, músculos, dropset por semana] */
const E=(n,s,r,i,rest,t,m,drop)=>({n,s:Array.isArray(s)?s:[s,s,s,s],r,i,rest,t,m,drop});
const PUSH=[E('Extensión de tríceps en polea',3,'12/15','RIR 0 · fallo',165,'3E',['triceps']),E('Press francés con barra',3,'8/10','RIR 0 · fallo',165,'3E',['triceps']),E('Elevaciones laterales con mancuerna',3,'10','Al fallo',165,'2E',['hombro']),E('Press banca plano',3,'4/6','RIR 1-0',180,'2E',['pecho','triceps']),E('Press inclinado en Smith',3,'8/10','RIR 0 · fallo',180,'3E',['pecho','hombro'])];
const CUR=[E('Curl de bíceps en máquina o polea',3,'10/12','RIR 1-0',165,'1C 2E',['biceps']),E('Curl martillo con mancuerna',3,'10/12','RIR 1-0',165,'1C 2E',['biceps','antebrazo']),E('Posteriores en polea',[2,3,3,3],'20/30','Al fallo',165,'2E',['post'])];
const DAYS={
'1':{t:'Empuje',m:'Pecho, hombro y tríceps',w:'2 × 8 del primer ejercicio, sin fatigar, bajando en 3 s',ex:PUSH},
'2':{t:'Tirón',m:'Espalda en amplitud y bíceps',w:'2 × 8 del primer ejercicio, sin fatigar, bajando en 3 s',ex:[E('Dorsalera agarre prono',3,'10/12','RIR 1-0',165,'2C 2E',['espalda']),E('Remo T',3,'8/10','RIR 1-0',165,'2C 2E',['espalda','post']),E('Pull around',3,'10/12','RIR 1-0',165,'',['espalda']),E('Remo en polea agarre amplio',[2,2,3,3],'10/12','RIR 1-0',165,'',['espalda','post']),...CUR]},
'3':{t:'Pierna',m:'Cuádriceps, isquios y glúteo',w:'Movilidad, activación de core y 2 × 8 del primer ejercicio bajando en 3 s',ex:[E('Sentadilla en Smith',3,'6','RIR 1-0',180,'2E',['cuad','gluteo']),E('Prensa',3,'10/12','Al fallo',180,'2E',['cuad','gluteo']),E('Elevaciones de cadera con barra',3,'8/10','Al fallo',165,'5C 3E',['gluteo']),E('Peso muerto con barra, ligero',[2,3,3,3],'4/6','RIR 1-0',180,'3E',['isquio','gluteo','espalda']),E('Extensión de cuádriceps',3,'10','RIR 1-0',165,'2C 3E',['cuad'])]},
'4':{t:'Empuje',m:'Pecho, hombro y tríceps',w:'2 × 8 del primer ejercicio, sin fatigar, bajando en 3 s',ex:[...PUSH,E('Aperturas en máquina o polea',3,'10/12','Al fallo',30,'2E',['pecho'])]},
'5':{t:'Tirón',m:'Espalda en densidad y bíceps',w:'2 × 8 del primer ejercicio, sin fatigar, bajando en 3 s',ex:[E('Pull over en polea',3,'10/12','RIR 1-0',165,'',['espalda']),E('Remo alto',3,'10/12','RIR 1-0',165,'2C 2E',['espalda','post']),E('Remo T',3,'8/10','RIR 1-0',165,'2C 2E',['espalda','post']),E('Remo amplio',2,'8/10','RIR 1-0',165,'',['espalda'],[0,1,1,1]),...CUR]}};
const XTRA={gem:{t:'Gemelos',ex:[E('Gemelos en Smith de pie',3,'8/10','Al fallo',105,'2C 2E',['gemelo']),E('Gemelos en máquina sentado',3,'15/20','Al fallo',60,'2C 2E',['gemelo'])]},
abs:{t:'Abdominales',ex:[E('Crunch en polea',3,'12/15','Al fallo',80,'Lento',['abs']),E('Elevaciones de piernas colgado',3,'15/20','Al fallo',80,'Lento',['abs']),E('Twist ruso',3,'20/30','Al fallo',80,'Lento',['abs'])]}};
const IMG={"Extensión de tríceps en polea": "Triceps_Pushdown", "Press francés con barra": "EZ-Bar_Skullcrusher", "Elevaciones laterales con mancuerna": "Side_Lateral_Raise", "Press banca plano": "Barbell_Bench_Press_-_Medium_Grip", "Press inclinado en Smith": "Smith_Machine_Incline_Bench_Press", "Aperturas en máquina o polea": "Butterfly", "Dorsalera agarre prono": "Wide-Grip_Lat_Pulldown", "Remo T": "T-Bar_Row_with_Handle", "Pull around": "One_Arm_Lat_Pulldown", "Remo en polea agarre amplio": "Seated_Cable_Rows", "Curl de bíceps en máquina o polea": "Standing_Biceps_Cable_Curl", "Curl martillo con mancuerna": "Hammer_Curls", "Posteriores en polea": "Cable_Rear_Delt_Fly", "Sentadilla en Smith": "Smith_Machine_Squat", "Prensa": "Leg_Press", "Elevaciones de cadera con barra": "Barbell_Hip_Thrust", "Peso muerto con barra, ligero": "Barbell_Deadlift", "Extensión de cuádriceps": "Leg_Extensions", "Pull over en polea": "Rope_Straight-Arm_Pulldown", "Remo alto": "Leverage_High_Row", "Remo amplio": "Leverage_Iso_Row", "Gemelos en Smith de pie": "Smith_Machine_Calf_Raise", "Gemelos en máquina sentado": "Seated_Calf_Raise", "Crunch en polea": "Cable_Crunch", "Elevaciones de piernas colgado": "Hanging_Leg_Raise", "Twist ruso": "Russian_Twist"};
const ALTS=['15 flexiones de antebrazo con lo que tengas a mano','1 minuto de respiración 4-4-4-4','20 saltos de comba o en el sitio','Bebe un vaso de agua entero','Escribe 1 idea para los ebooks','10 sentadillas lentas','Estira la cadera 1 minuto'];

/* Mapa del cuerpo: frente (izq) y espalda (dcha) */
const PARTS={
F:[['c','0','9','6.5'],['r','0','-11','16','22','40','9'],['e','hombro','-13.5','22','5','5'],['e','hombro','13.5','22','5','5'],['e','pecho','-6','27','6.5','5'],['e','pecho','6','27','6.5','5'],['r','abs','-6','33','12','20','4'],['e','biceps','-17','34','3.6','7'],['e','biceps','17','34','3.6','7'],['e','antebrazo','-19.5','49','3','7.5'],['e','antebrazo','19.5','49','3','7.5'],['r','0','-9','52','18','8','4'],['e','cuad','-5.5','69','5.5','12'],['e','cuad','5.5','69','5.5','12'],['e','0','-5.5','89','3.4','8'],['e','0','5.5','89','3.4','8']],
B:[['c','0','9','6.5'],['r','0','-11','16','22','40','9'],['r','espalda','-7','17','14','7','3'],['e','post','-13.5','22','5','5'],['e','post','13.5','22','5','5'],['e','espalda','-6.5','32','6.8','10'],['e','espalda','6.5','32','6.8','10'],['e','triceps','-17','34','3.6','7'],['e','triceps','17','34','3.6','7'],['e','0','-19.5','49','3','7.5'],['e','0','19.5','49','3','7.5'],['e','gluteo','-5','57','5.5','5.5'],['e','gluteo','5','57','5.5','5.5'],['e','isquio','-5.5','72','5','9.5'],['e','isquio','5.5','72','5','9.5'],['e','gemelo','-5.5','89','3.8','7.5'],['e','gemelo','5.5','89','3.8','7.5']]};
function bodySVG(ms){const col=k=>{const i=ms.indexOf(k);return i===0?'var(--acc)':i>0?'color-mix(in srgb,var(--acc) 50%,var(--srf2))':'var(--srf2)'};
 const fig=(cx,arr)=>arr.map(p=>{const f=col(p[1]);if(p[0]==='c')return`<circle cx="${cx}" cy="${p[2]}" r="${p[3]}" fill="var(--srf2)"/>`;if(p[0]==='e')return`<ellipse cx="${cx+ +p[2]}" cy="${p[3]}" rx="${p[4]}" ry="${p[5]}" fill="${f}"/>`;return`<rect x="${cx+ +p[2]}" y="${p[3]}" width="${p[4]}" height="${p[5]}" rx="${p[6]}" fill="${f}"/>`}).join('');
 return`<svg viewBox="0 0 120 100" aria-hidden="true">${fig(30,PARTS.F)}${fig(90,PARTS.B)}</svg>`}

const DEF=()=>({shift:{ref:'2026-11-23',refShift:'tarde',refOff:3},cycle:'2026-11-23',future:'',off:{},body:[],altStart:'2026-11-22',drafts:{},todos:[],habits:DEFH.map(h=>({...h}))});
let D={cfg:DEF(),gym:{sessions:[]},months:{}};
const UI={tab:'hoy',cur:todayS(),mode:'local',brT:null,imp:0,gday:null,rest:null};
const EMPTY={h:{},meals:{},urges:{ok:0,no:0},ci:{}};
const fixCfg=c=>{const d=DEF();const o={...d,...c,shift:{...d.shift,...(c&&c.shift||{})}};if(!Array.isArray(o.habits))o.habits=DEFH.map(h=>({...h}));if(!o.drafts||typeof o.drafts!=='object')o.drafts={};if(!Array.isArray(o.todos))o.todos=[];delete o.routine;delete o.draft;return o};
try{const j=JSON.parse(localStorage.getItem('hprime-v1')||'null');if(j){D.cfg=fixCfg(j.cfg);D.gym=j.gym||D.gym;D.months=j.months||{}}}catch(e){}

const getDay=ds=>D.months['m-'+ds.slice(0,7)]?.days?.[ds]||EMPTY;
const dirty=new Set();let SB=null,UID=null,EMAIL='',tm=null,flushing=false;
function getDoc(k){return k==='cfg'?D.cfg:k==='gym'?D.gym:D.months[k]}
function setDoc(k,v){if(k==='cfg')D.cfg=fixCfg(v);else if(k==='gym')D.gym={sessions:[],...v};else D.months[k]={days:{},...v}}
function saveLocal(){try{localStorage.setItem('hprime-v1',JSON.stringify(D))}catch(e){}}
function touch(k){const o=getDoc(k);if(o)o._u=Date.now();dirty.add(k);saveLocal();clearTimeout(tm);tm=setTimeout(flush,900)}
function mutDay(ds){const mk='m-'+ds.slice(0,7);const m=D.months[mk]||(D.months[mk]={days:{}});const d=m.days[ds]||(m.days[ds]={h:{},meals:{},urges:{ok:0,no:0},ci:{}});touch(mk);return d}
async function flush(){if(!SB||!UID||flushing)return;flushing=true;
 for(const k of [...dirty]){dirty.delete(k);try{const r=await SB.from('hprime_docs').upsert({user_id:UID,key:k,data:JSON.parse(JSON.stringify(getDoc(k)||{})),updated_at:new Date().toISOString()},{onConflict:'user_id,key'});if(r.error)throw r.error}catch(e){dirty.add(k);UI.mode='offline';paintSync();break}}
 flushing=false;if(dirty.size){clearTimeout(tm);tm=setTimeout(flush,3000)}}

function dayInfo(d){const c=D.cfg.shift;const wi=Math.round(diff(parse(c.ref),monday(d))/7);const other=c.refShift==='tarde'?'manana':'tarde';const shift=((wi%2)+2)%2===0?c.refShift:other;const off=(((+c.refOff+wi)%6)+6)%6;const w=dow(d);const libre=w===6||w===off;return{shift,off,libre,type:libre?'libre':shift}}
function cycleWeek(ds){const w=Math.floor(diff(parse(D.cfg.cycle),monday(parse(ds)))/7);return((w%4)+4)%4+1}
function weekCount(id,ds){const m=monday(parse(ds));let c=0;for(let i=0;i<7;i++)if(getDay(ymd(addD(m,i))).h[id])c++;return c}
function tasksFor(ds){const d=parse(ds),info=dayInfo(d),day=getDay(ds),left=7-dow(d);
 return habits().filter(h=>!D.cfg.off[h.id]).map(h=>{const done=!!day.h[h.id];let req=true,meta='',hot=false,show=true;
  if(h.f==='a'){const due=((diff(parse(h.start||D.cfg.altStart),d)%2)+2)%2===0;if(!due&&!done)show=false;meta=due?'Hoy toca':''}
  if(h.f==='w'){const c=weekCount(h.id,ds);const need=h.k-(c-(done?1:0));if(!done&&c>=h.k)show=false;req=need>0&&left===need;meta=c+'/'+h.k+' esta semana';
   if(need>0&&left<=need&&!done){meta+=' · hoy toca sí o sí';hot=true}else if(h.fam&&info.libre&&!done){meta+=' · buen día para esto';hot=true}}
  return{...h,done,req,meta,hot,show}}).filter(t=>t.show)}
function nutriOk(day){const v=Object.values(day.meals||{});return v.length>=3&&!v.includes('r')}
function score(ds){const t=tasksFor(ds),day=getDay(ds);const req=t.filter(x=>x.req);const dr=req.filter(x=>x.done).length+(nutriOk(day)?1:0)+(day.cocina?1:0);const opt=t.filter(x=>!x.req&&x.done).length;return Math.min(1,(dr+opt*.5)/(req.length+2))}
function allDays(){const out=[];for(const k in D.months)for(const ds in (D.months[k].days||{}))out.push(ds);return out.sort()}
function streaks(){const days=allDays();const t=todayS();if(!days.length)return{cur:0,best:0};
 let best=0,run=0,miss=0;for(let d=parse(days[0]);ymd(d)<=t;d=addD(d,1)){const ds=ymd(d);if(score(ds)>=.7){run++;miss=0}else if(ds!==t){miss++;if(miss>=2)run=0}if(run>best)best=run}return{cur:run,best}}

function toast(m){if(!m)return;const el=$('#toast');el.textContent=m;el.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>el.classList.remove('on'),1900)}
function gain(_,txt){toast(txt)}
function paintSync(){const el=$('#sync');if(el)el.textContent=UI.mode==='cloud'?'Guardado en tu cuenta':UI.mode==='offline'?'Sin conexión: se guardará al volver':'Guardado en este móvil'}

/* ---------- HOY ---------- */
function ringSVG(p){const C=2*Math.PI*58;return`<svg viewBox="0 0 136 136" aria-hidden="true"><circle cx="68" cy="68" r="58" fill="none" stroke="var(--srf2)" stroke-width="12"/><circle class="f" cx="68" cy="68" r="58" fill="none" stroke="var(--acc)" stroke-width="12" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-p)}"/></svg>`}
function heroHoy(){const d=parse(UI.cur),info=dayInfo(d),p=score(UI.cur),S=streaks(),isT=UI.cur===todayS(),ts=tasksFor(UI.cur);
 const sh=info.libre?(dow(d)===6?'Domingo libre':'Día libre'):(info.shift==='tarde'?'Turno de tarde · 13:45 a 22:00':'Turno de mañana · 6:00 a 14:15');
 const lim=diff(d,new Date())>=14;
 return`<header class="hero"><div class="in"><div class="top"><span class="brand">HPrime</span><span class="sync" id="sync"></span></div>
 <div class="dnav"><button class="rb" data-a="dprev" aria-label="Día anterior" ${lim?'disabled':''}>‹</button><h1>${isT?'Hoy, ':''}${DN[dow(d)]} ${d.getDate()}</h1><button class="rb" data-a="dnext" aria-label="Día siguiente" ${isT?'disabled':''}>›</button></div>
 <span class="chip"><i style="background:${info.libre?'var(--g)':info.shift==='tarde'?'var(--pm)':'var(--am)'}"></i>${sh}</span>

function nextDay(){const s=D.gym.sessions.filter(x=>DAYS[x.day]);if(!s.length)return'1';const n=+s[s.length-1].day;return String(n%5+1)}
const parseR=r=>{const[a,b]=r.split('/').map(Number);return[a,b||a]};
function lastOf(name){const s=D.gym.sessions;for(let i=s.length-1;i>=0;i--){const e=s[i].ex.find(x=>x.n===name);if(e&&e.sets.length)return{date:s[i].date,sets:e.sets}}return null}
function suggest(ex,sets,last){const[lo,hi]=parseR(ex.r);if(!last)return`Primera vez: elige un peso con el que llegues justo a ${hi} repeticiones`;
 const kg=Math.max(...last.sets.map(x=>x[0]||0));if(!kg)return'Busca 1 repetición más que la última vez';
 if(last.sets.length>=sets&&last.sets.every(x=>x[1]>=hi))return`Llegaste a ${hi} en todas: hoy sube a ${fmt(kg+(kg>=20?2.5:1))} kg`;
 return`Mismo peso y busca 1 repetición más`}

 const rows=Array.from({length:sets},(_,j)=>{const k=key+':'+i+':'+j;const cur=v[k]||[];const ls=last?(last.sets[j]||last.sets[last.sets.length-1]):null;
  return`<div class="set${cur[2]?' dn':''}"><span>${j+1}</span><input inputmode="decimal" aria-label="Kilos serie ${j+1}" data-in="set" data-k="${k}" data-f="0" value="${cur[0]??''}" placeholder="${ls?fmt(ls[0]):'kg'}"><input inputmode="numeric" aria-label="Repeticiones serie ${j+1}" data-in="set" data-k="${k}" data-f="1" value="${cur[1]??''}" placeholder="${ls?ls[1]:ex.r}"><button class="ok-b" data-a="sdone" data-k="${k}" data-rest="${ex.rest}" data-n="${esc(ex.n)}" data-ph="${ls?ls[0]+'|'+ls[1]:'|'+hi}" aria-label="Serie ${j+1} hecha"></button></div>`}).join('');
 const q=encodeURIComponent(ex.n+' técnica correcta');

 return`<div class="ex"><div class="exh">${pic}<div><h4><small>${i+1}</small>${esc(ex.n)}</h4><div class="tags"><span class="k">${sets} × ${ex.r}</span><span>${ex.i}</span><span>Descanso ${restTxt(ex.rest)}</span>${ex.t?`<span>Tempo ${ex.t}</span>`:''}</div>
 <a class="how" href="https://www.youtube.com/results?search_query=${q}" target="_blank" rel="noopener">Ver cómo se hace ↗</a></div></div>
 ${ex.drop&&ex.drop[wk-1]?`<div class="last" style="color:var(--acc);font-weight:600">Esta semana: +1 dropset en la última serie</div>`:''}
 <div class="last">${last?'Última vez: '+last.sets.map(x=>fmt(x[0])+' × '+x[1]).join(' · '):''}</div><div class="sug2">${suggest(ex,sets,last)}</div>

 <div class="card"><h2>Tu cuenta</h2><p class="sub">${esc(EMAIL||'')}</p><button class="btn gh full" data-a="logout">Cerrar sesión</button></div>
 <div class="card"><h2>Copia de seguridad</h2><button class="btn gh full" data-a="copy">Copiar mis datos</button>
 <label for="imp">Pegar una copia para restaurarla</label><textarea id="imp" placeholder="Pega aquí el texto copiado"></textarea><button class="btn gh full" style="margin-top:8px" data-a="imp">${UI.imp?'Pulsa otra vez: sustituye todo':'Restaurar'}</button></div>`}

const ro=new ResizeObserver(()=>drawSparks());
function drawSparks(){for(const s of document.querySelectorAll('svg.spark')){const k=s.dataset.k,u=s.dataset.u,W=s.clientWidth,Hh=s.clientHeight;if(!W)continue;
 const M=MEAS.find(m=>m[0]===k)||MEAS[0];const u2=M[2];const pts=[...D.cfg.body].filter(b=>b[k]!=null).sort((a,b)=>a.d<b.d?-1:1);const title=`<text x="0" y="14">${M[1]}</text>`;
 if(pts.length<2){s.innerHTML=title+`<text x="0" y="${Hh/2+6}" style="fill:var(--mut)">2 registros y verás la línea</text>`;continue}
 const v=pts.map(p=>p[k]),mn=Math.min(...v),mx=Math.max(...v),r=(mx-mn)||1,L=6,R=W-52,T=28,B=Hh-10;
 const xy=v.map((y,i)=>[L+(R-L)*i/(v.length-1),B-(B-T)*(y-mn)/r]);
 s.innerHTML=title+`<polyline points="${xy.map(p=>p.join(',')).join(' ')}" fill="none" stroke="var(--acc)" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>`+xy.map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="3.5" fill="var(--acc)"/>`).join('')+`<text x="${R+8}" y="${xy[xy.length-1][1]+5}">${fmt(v[v.length-1])} ${u2}</text>`}}

function render(keep){ro.disconnect();const y=window.scrollY;if(UI.tab!=='hoy')UI.cur=todayS();
 let hd,body;if(UI.tab==='hoy'){hd=heroHoy();body=viewHoy()}else if(UI.tab==='gym'){hd=heroGym();body=viewGym()}else if(UI.tab==='progreso'){hd=heroSmall('Progreso','Cómo vas y cómo cambia tu cuerpo');body=viewProg()}else if(UI.tab==='pendientes'){const n=D.cfg.todos.filter(t=>!t.done).length;hd=heroSmall('Pendientes',n?(n===1?'1 cosa por hacer':n+' cosas por hacer'):'Todo al día');body=viewTodo()}else{hd=heroSmall('Ajustes','Tu calendario, tus hábitos y tus datos');body=viewYo()}
 $('#app').innerHTML=hd+`<main class="wrap">${body}</main>`;
 for(const b of document.querySelectorAll('.tabs button'))b.classList.toggle('on',b.dataset.t===UI.tab);
 paintSync();for(const s of document.querySelectorAll('svg.spark'))ro.observe(s);if(keep)window.scrollTo(0,y)}

function openSheet(html){$('#pn').innerHTML=html;$('#sheet').classList.add('on')}
function closeSheet(){$('#sheet').classList.remove('on');clearInterval(UI.brT);UI.brT=null}
function breath(){let left=120,e=0;const ph=['Inhala','Mantén','Exhala','Mantén'];openSheet(`<h2>Respiración 4-4-4-4</h2><p class="sub">Sigue la bola. A los 2 minutos se marca solo.</p><div class="orb"></div><div class="phase" id="ph">Inhala<small id="pt">2:00</small></div><div class="g2"><button class="btn gh" data-a="close">Salir</button><button class="btn" data-a="brok">Hecho</button></div>`);
 UI.brT=setInterval(()=>{e++;left--;const p=$('#ph');if(!p)return;p.firstChild.textContent=ph[Math.floor((e%16)/4)];$('#pt').textContent=mmss(left);if(left<=0)finishBreath()},1000)}
function finishBreath(){closeSheet();if(!getDay(UI.cur).h.resp){mutDay(UI.cur).h.resp=1;render(1);toast('Respiraciones hechas')}}
function shield(){openSheet(`<h2>Antes de abrir redes</h2><p class="sub">Haz esto 1 minuto. Si después aún quieres mirar, decides tú.</p><div class="alt">${ALTS[Math.floor(Math.random()*ALTS.length)]}</div><div class="g2"><button class="btn gh" data-a="urge" data-r="no">He caído</button><button class="btn" data-a="urge" data-r="ok">Lo he resistido</button></div><button class="mini" data-a="shield" style="margin-top:12px">Otra opción</button>`)}

function startRest(sec,name){UI.rest={end:Date.now()+sec*1000,name};$('#rest').classList.add('on');tickRest()}
function tickRest(){const r=UI.rest;if(!r)return;const left=Math.max(0,Math.round((r.end-Date.now())/1000));$('#rt').textContent=mmss(left);$('#rn').textContent=left?'Descanso · '+r.name:'¡A por la siguiente serie!';if(!left){try{navigator.vibrate&&navigator.vibrate(300)}catch(e){}clearTimeout(UI.rT);UI.rT=setTimeout(stopRest,4000);UI.rest=null;return}UI.rT=setTimeout(tickRest,500)}
function stopRest(){UI.rest=null;clearTimeout(UI.rT);$('#rest').classList.remove('on')}
function ensureDraft(day){let d=draft(day);if(!d){d={date:todayS(),v:{},x:{}};D.cfg.drafts[day]=d}return d}

document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b){if(e.target.id==='sheet')closeSheet();return}const a=b.dataset.a,ds=UI.cur;
 if(a==='tab'){if(location.hash.slice(1)===b.dataset.t){window.scrollTo(0,0);return}location.hash=b.dataset.t;return}
 if(a==='dprev'){UI.cur=ymd(addD(parse(ds),-1));render();return}
 if(a==='dnext'){UI.cur=ymd(addD(parse(ds),1));render();return}
 if(a==='close'){closeSheet();return}
 if(a==='plan'){planSheet();return}
 if(a==='photo'){const n=b.dataset.n,ex=[...Object.values(DAYS).flatMap(x=>x.ex),...Object.values(XTRA).flatMap(x=>x.ex)].find(e=>e.n===n),im=IMG[n];if(!ex||!im)return;const q=encodeURIComponent(n+' técnica correcta');
  openSheet(`<h2>${esc(n)}</h2><div class="tags"><span class="k">${ex.r} reps</span><span>${ex.i}</span><span>Descanso ${restTxt(ex.rest)}</span>${ex.t?`<span>Tempo ${ex.t}</span>`:''}</div>
  <div class="shots"><figure><img src="img/${im}-0.jpg" alt="${esc(n)}: posición inicial"><figcaption>1. Empiezas así</figcaption></figure><figure><img src="img/${im}-1.jpg" alt="${esc(n)}: posición final"><figcaption>2. Y llegas aquí</figcaption></figure></div>
  <div class="exh" style="margin-top:14px;grid-template-columns:90px minmax(0,1fr);align-items:center"><div class="map">${bodySVG(ex.m)}</div><p class="note" style="margin:0">En naranja, el músculo que trabaja. La foto es orientativa: si en tu gym la máquina es distinta, el movimiento es el mismo.</p></div>
  <a class="btn full" style="display:grid;place-items:center;text-decoration:none;margin-top:14px" href="https://www.youtube.com/results?search_query=${q}" target="_blank" rel="noopener">Ver vídeo de la técnica ↗</a>
  <button class="btn gh full" data-a="close" style="margin-top:8px">Cerrar</button>`);return}
 if(a==='logout'){flush().finally(()=>SB.auth.signOut().then(()=>{try{localStorage.removeItem('hprime-v1');localStorage.removeItem('hprime-uid')}catch(err){}location.reload()}));return}
 const before=0;
 if(a==='tog'){const id=b.dataset.h,day=mutDay(ds);let msg='';if(day.h[id])delete day.h[id];else{day.h[id]=1}render(1);gain(before,msg);return}
 if(a==='meal'){const day=mutDay(ds),k=b.dataset.k,v=b.dataset.v;if(day.meals[k]===v)delete day.meals[k];else day.meals[k]=v;render(1);gain(before,'');return}
 if(a==='cocina'){const day=mutDay(ds);day.cocina=day.cocina?0:1;render(1);gain(before,day.cocina?'Cocina cerrada':'');return}
 if(a==='agua'){const day=mutDay(ds),dd=+b.dataset.d;day.agua=Math.max(0,Math.min(20,(day.agua||0)+dd));render(1);gain(before,day.agua===WATER&&dd>0?'3 litros completados':'');return}
 if(a==='shield'){shield();return}
 if(a==='urge'){const day=mutDay(todayS());day.urges[b.dataset.r]=(day.urges[b.dataset.r]||0)+1;closeSheet();render(1);gain(before,b.dataset.r==='ok'?'Bien hecho':'Apuntado. La próxima la ganas tú.');return}
 if(a==='breath'){breath();return}
 if(a==='brok'){finishBreath();return}
 if(a==='gday'){UI.gday=b.dataset.d;render();return}
 if(a==='sdone'){const day=UI.gday||nextDay(),dr=ensureDraft(day),k=b.dataset.k;const cur=dr.v[k]||(dr.v[k]=['','',0]);
  if(cur[2]){cur[2]=0;touch('cfg');render(1);stopRest();return}
  const[pk,pr]=b.dataset.ph.split('|');if(cur[0]===''||cur[0]==null)cur[0]=pk;if(cur[1]===''||cur[1]==null)cur[1]=pr;
  if(num(cur[1])==null){toast('Escribe las repeticiones');return}cur[2]=1;touch('cfg');render(1);startRest(+b.dataset.rest,b.dataset.n);return}
 if(a==='rskip'){stopRest();return}
 if(a==='rplus'){if(UI.rest)UI.rest.end+=30000;return}
 if(a==='xadd'){const dr=ensureDraft(UI.gday||nextDay());dr.x[b.dataset.k]=1;touch('cfg');render(1);return}
 if(a==='gfin'){const day=UI.gday||nextDay(),dr=draft(day),wk=cycleWeek(todayS());if(!dr){toast('Apunta al menos una serie');return}
  const blocks=[['m',DAYS[day].ex]];for(const k of ['gem','abs'])if(dr.x[k])blocks.push([k,XTRA[k].ex]);
  const ex=[];const x={};for(const[key,list] of blocks)list.forEach((e,i)=>{const sets=[];for(let j=0;j<e.s[wk-1];j++){const c=dr.v[key+':'+i+':'+j];if(!c)continue;const kg=num(c[0])??0,r=num(c[1]);if(r!=null&&r>0)sets.push([kg,r])}if(sets.length){ex.push({n:e.n,sets});if(key!=='m')x[key]=1}});
  if(!ex.length){toast('Apunta al menos una serie');return}
  let pr=0;const prs=[];for(const e of ex){let old=0;for(const s of D.gym.sessions)for(const y of s.ex)if(y.n===e.n)for(const[kg,r] of y.sets)old=Math.max(old,kg*(1+r/30));const nw=Math.max(...e.sets.map(([kg,r])=>kg*(1+r/30)));if(old&&nw>old){pr++;prs.push(e.n)}}
  D.gym.sessions.push({date:todayS(),day,w:wk,ex,x,pr});touch('gym');delete D.cfg.drafts[day];touch('cfg');const td=mutDay(todayS());td.h.gym=1;if(x.abs)td.h.abs=1;UI.gday=null;stopRest();render();window.scrollTo(0,0);
  if(prs.length)openSheet(`<h2>Nueva mejor marca</h2><p class="sub">${prs.map(esc).join(', ')}. Tu mejor marca hasta hoy.</p><button class="btn full" data-a="close">Vamos</button>`);else toast('Entreno guardado');return}
 if(a==='meas'){UI.meas=b.dataset.k;render(1);return}
 if(a==='body'){const vals={};for(const[k] of MEAS){const v=num($('#b-'+k).value);if(v!=null)vals[k]=v}if(!Object.keys(vals).length){toast('Escribe al menos una medida');return}const d=todayS();const ex=D.cfg.body.find(x=>x.d===d);if(ex)Object.assign(ex,vals);else D.cfg.body.push({d,...vals});touch('cfg');render(1);toast('Medidas guardadas');return}
 if(a==='ttog'){const t=D.cfg.todos.find(x=>x.id===b.dataset.id);if(!t)return;t.done=!t.done;t.dt=t.done?todayS():null;UI.tdel=null;touch('cfg');render(1);if(t.done)toast('¡Hecho!');return}
 if(a==='tdel'){const id=b.dataset.id;if(UI.tdel!==id){UI.tdel=id;render(1);return}UI.tdel=null;D.cfg.todos=D.cfg.todos.filter(x=>x.id!==id);touch('cfg');render(1);toast('Eliminada');return}
 if(a==='tclear'){if(!UI.tclr){UI.tclr=1;render(1);return}UI.tclr=0;D.cfg.todos=D.cfg.todos.filter(x=>!x.done);touch('cfg');render(1);toast('Hechas borradas');return}
 if(a==='hdel'){const id=b.dataset.h;if(UI.del!==id){UI.del=id;render(1);return}UI.del=null;D.cfg.habits=D.cfg.habits.filter(h=>h.id!==id);delete D.cfg.off[id];touch('cfg');render(1);toast('Hábito eliminado');return}
 if(a==='hadd'){const n=$('#nh-n').value.trim();if(!n){toast('Escribe el hábito');$('#nh-n').focus();return}const fv=$('#nh-f').value,h={id:'u'+Date.now().toString(36),n,sl:$('#nh-s').value,f:fv[0]};if(fv[0]==='w')h.k=+fv.slice(1);if(h.f==='a')h.start=todayS();D.cfg.habits.push(h);touch('cfg');render(1);toast('Hábito añadido');return}
 if(a==='hab'){const id=b.dataset.h;if(D.cfg.off[id])delete D.cfg.off[id];else D.cfg.off[id]=1;touch('cfg');render(1);return}
 if(a==='copy'){const txt=JSON.stringify(D);const fb=()=>{const t=$('#imp');t.value=txt;t.select();toast('Selecciona y copia el texto')};try{navigator.clipboard.writeText(txt).then(()=>toast('Datos copiados'),fb)}catch(err){fb()}return}
 if(a==='imp'){if(!UI.imp){UI.imp=1;render(1);return}UI.imp=0;try{const j=JSON.parse($('#imp').value);if(!j.cfg||!j.months)throw 0;D={cfg:fixCfg(j.cfg),gym:j.gym||{sessions:[]},months:j.months};touch('cfg');touch('gym');for(const k in D.months)touch(k);render();toast('Copia restaurada')}catch(err){render(1);toast('Ese texto no es una copia válida')}return}
});
document.addEventListener('submit',e=>{if(e.target.id!=='tform')return;e.preventDefault();const i=$('#tin'),v=i.value.trim();if(!v){i.focus();return}D.cfg.todos.unshift({id:'t'+Date.now().toString(36),t:v,done:false,at:todayS()});touch('cfg');render(1);const n=$('#tin');if(n)n.focus()});
let inT=null;
document.addEventListener('input',e=>{const t=e.target,k=t.dataset.in;if(!k)return;
 if(k==='set'){const dr=ensureDraft(UI.gday||nextDay());const c=dr.v[t.dataset.k]||(dr.v[t.dataset.k]=['','',0]);c[+t.dataset.f]=t.value;clearTimeout(inT);inT=setTimeout(()=>touch('cfg'),600);return}
 if(k==='fut'){D.cfg.future=t.value;clearTimeout(inT);inT=setTimeout(()=>touch('cfg'),700);return}
 if(k==='ci'){const v=num(t.value),ds=UI.cur,kk=t.dataset.k;clearTimeout(inT);inT=setTimeout(()=>{const day=mutDay(ds);if(v==null)delete day.ci[kk];else day.ci[kk]=v},500);return}
});
document.addEventListener('change',e=>{const t=e.target;
 if(t.dataset.in==='sh'){const k=t.dataset.k;let v=t.value;if(k==='ref'){if(!v)return;v=ymd(monday(parse(v)))}if(k==='refOff')v=+v;D.cfg.shift[k]=v;touch('cfg');render(1)}
 if(t.dataset.in==='cy'&&t.value){D.cfg.cycle=ymd(monday(parse(t.value)));touch('cfg');render(1)}});

function route(){UI.del=null;const h=location.hash.slice(1);UI.tdel=null;UI.tclr=0;UI.tab=['hoy','gym','pendientes','progreso','yo'].includes(h)?h:'hoy';closeSheet();render()}
window.addEventListener('hashchange',()=>{route();window.scrollTo(0,0)});
let lastDay=todayS();document.addEventListener('visibilitychange',()=>{if(document.hidden){flush();return}if(todayS()!==lastDay){lastDay=todayS();UI.cur=lastDay;render()}cloudLoad()});
route();

/* ---------- Nube: Supabase ---------- */
async function cloudLoad(){if(!SB||!UID)return;try{
 const r=await SB.from('hprime_docs').select('key,data').eq('user_id',UID);if(r.error)throw r.error;
 const seen={};for(const row of r.data){seen[row.key]=1;const loc=getDoc(row.key),rem=row.data||{};if(!loc||(rem._u||0)>=(loc._u||0))setDoc(row.key,JSON.parse(JSON.stringify(rem)));else dirty.add(row.key)}
 for(const k of ['cfg','gym',...Object.keys(D.months)]){const loc=getDoc(k);if(!seen[k]&&loc&&loc._u)dirty.add(k)}
 UI.mode='cloud';saveLocal();if(!document.activeElement||!document.activeElement.dataset?.in)render(1);else paintSync();if(dirty.size)flush()}catch(e){UI.mode='offline';paintSync()}}
const AU={mode:'login'};
function showAuth(on){$('#auth').classList.toggle('on',on);if(on){$('#au-t').textContent=AU.mode==='login'?'HPrime':'Crea tu cuenta';$('#au-s').textContent=AU.mode==='login'?'Entra con tu cuenta':'Solo necesitas un email y una contraseña';$('#au-go').textContent=AU.mode==='login'?'Entrar':'Crear cuenta';$('#au-sw').textContent=AU.mode==='login'?'No tengo cuenta: crear una':'Ya tengo cuenta: entrar'}}
function startSession(s){EMAIL=s.user.email;const uid=s.user.id;let prev=null;try{prev=localStorage.getItem('hprime-uid')}catch(e){}
 if(prev&&prev!==uid){D={cfg:DEF(),gym:{sessions:[]},months:{}};dirty.clear()}
 try{localStorage.setItem('hprime-uid',uid)}catch(e){}UID=uid;showAuth(false);render();cloudLoad()}
$('#au-sw').addEventListener('click',()=>{AU.mode=AU.mode==='login'?'signup':'login';$('#au-err').textContent='';showAuth(true)});
$('#authform').addEventListener('submit',async e=>{e.preventDefault();const em=$('#au-e').value.trim(),pw=$('#au-p').value,er=$('#au-err');er.textContent='';
 if(!/^\S+@\S+\.\S+$/.test(em)){er.textContent='Escribe un email válido.';return}if(pw.length<6){er.textContent='La contraseña debe tener al menos 6 caracteres.';return}
 const go=$('#au-go');go.disabled=true;go.textContent='Un momento…';
 try{const r=AU.mode==='signup'?await SB.auth.signUp({email:em,password:pw}):await SB.auth.signInWithPassword({email:em,password:pw});
  if(r.error){const m=r.error.message||'';er.textContent=/invalid login/i.test(m)?'Email o contraseña incorrectos.':/already registered|already exists/i.test(m)?'Ya existe una cuenta con ese email. Pulsa «Ya tengo cuenta».':/rate|too many/i.test(m)?'Demasiados intentos. Espera un minuto.':'No se pudo: '+m}
  else if(!r.data.session){er.textContent='Revisa tu email y confirma la cuenta; después entra aquí.';AU.mode='login'}
 }catch(err){er.textContent='Sin conexión. Inténtalo de nuevo.'}
 go.disabled=false;showAuth(!UID)});
(async()=>{const C=window.HPRIME_CONFIG||{};if(!window.supabase||!C.url){UI.mode='offline';paintSync();return}
 SB=window.supabase.createClient(C.url,C.key,{auth:{persistSession:true,autoRefreshToken:true}});
 const r=await SB.auth.getSession();const s=r.data&&r.data.session;if(s)startSession(s);else showAuth(true);
 SB.auth.onAuthStateChange((ev,ss)=>{if(ss&&ss.user&&ss.user.id!==UID)startSession(ss);if(!ss&&UID){location.reload()}})})();
}
</script>
